<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sound Test</title>
<style>
  :root { --bg:#10131a; --card:#1b2030; --ink:#f3f5fa; --dim:#a8b0c4; --accent:#3ddc97; --warn:#ffb547; --bad:#ff6b6b; --line:#2c3347; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font:20px/1.45 -apple-system, system-ui, sans-serif; -webkit-text-size-adjust:100%; }
  body { padding:16px 16px 48px; }
  #prog { font-size:17px; color:var(--dim); min-height:26px; margin-bottom:12px; }
  #screen { max-width:900px; margin:0 auto; }
  h1 { font-size:34px; line-height:1.2; margin:8px 0 16px; }
  p { margin:0 0 14px; }
  .big { font-size:26px; }
  .btns { display:flex; flex-wrap:wrap; gap:14px; margin-top:22px; }
  button { font:inherit; font-size:26px; font-weight:600; min-width:110px; min-height:76px; padding:12px 26px; border-radius:16px; border:2px solid var(--line); background:var(--card); color:var(--ink); }
  button.go { background:var(--accent); color:#06281a; border-color:var(--accent); min-width:240px; }
  button:disabled { opacity:.45; }
  .note { color:var(--dim); font-size:18px; }
  .ok { color:var(--accent); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  table { border-collapse:collapse; width:100%; margin:6px 0 22px; font-size:17px; }
  th,td { border:1px solid var(--line); padding:5px 7px; text-align:left; vertical-align:top; }
  th { background:var(--card); }
  h2 { font-size:22px; margin:22px 0 4px; }
  .listen { font-size:44px; font-weight:700; text-align:center; margin:60px 0; }
</style>
</head>
<body>
<div id="prog"></div>
<div id="screen"></div>
<script>
'use strict';
/* =====================================================================
   Sound test for the poker clock, VERSION 2 (one hands-off run on Igor's iPad, about 5 min).
   Design under test: every sound plays with the music PAUSED, audio session 'playback' only.
   Never sets 'transient' or 'transient-solo' (that killed every player on the page in run 1).
   Rounds go from harmless to disruptive; before every round a health check of both sound engines
   (a muted probe: does the clock advance, any player in error) with self-repair, logged as one line.
   Results: on screen, in localStorage (one key per run + an outbox), sent to the Mac over PeerJS
   until the Mac acknowledges.
   ?fake=1  -> fake Spotify (stubbed fetch) + fake login in its OWN key. Switches (fake only):
              login=valid|expired|none, fail400=1, quick=1, ns=<name> (own storage), lid=<id> (own listener),
              spDie=a,b,c (after a paused seconds a plain "play" fails, after b also play?device_id, after c also transfer),
              kill=<round> (just before that round's health check: every player forced into error, the AudioContext closed),
              hang=<sound> (that file never answers), throwIn=<round>.
   ===================================================================== */
const PAGE_VERSION = 2;
const Q = new URLSearchParams(location.search);
const FAKE = Q.get('fake') === '1';
const AUTO = FAKE && Q.get('auto') === '1';
const QUICK = Q.get('quick') === '1';
const SPOTIFY_CLIENT_ID = '1af2112558374cc08c7dd725e9be0654';            /* = the clock's */
const SP_AUTH_KEY = FAKE ? 'soundtest_fake_spotify_auth' : 'poker_spotify_auth_v1';   /* real one = the clock's key */
const RES_KEY = FAKE ? 'soundtest_results_fake_v1' + (Q.get('ns') ? '_' + Q.get('ns').replace(/[^a-z0-9]/gi, '') : '') : 'soundtest_results_v1';
const PEERJS_SRC = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';   /* = the clock's PEERJS_SRC */
const LISTENER_ID = FAKE && Q.get('lid') ? Q.get('lid') : 'pokerclock-soundtest-mac-listener-v1';
const SFX_MS = { 'oh-my-god': 1615, 'wow': 2600, 'bruh': 629, 'fah': 1927, 'what': 400, 'cool-story-bro': 1110, 'boomshakalaka': 1190,
  'very-nice': 1075, 'emotional-damage': 2037, 'show-me-the-money': 2060, 'pay-that-man': 1670, 'what-happened': 910 };   /* = the clock's */
const NAMES = Object.keys(SFX_MS);
const SND = n => '../sounds/' + n + '.m4a';

const CFG = QUICK ? {
  earA: ['oh-my-god', 'fah'], earB: ['pay-that-man', 'emotional-damage'], earGap: 600,
  r2N: [2, 3, 4], r2Silent: 3, r2Music: 1200,
  r3Runs: 1, r3Rev: 1, r3Sounds: ['fah', 'emotional-damage', 'show-me-the-money'],
  r4Windows: 1, r4Burst: [[0, 'what'], [250, 'bruh'], [500, 'what'], [750, 'what-happened'], [1000, 'what'], [1250, 'very-nice']],
  r5Sounds: ['what', 'bruh'], r5Plays: 2, r5Gap: 600, r6Idle: 8000, r7Wait: 60000
} : {
  earA: ['oh-my-god', 'pay-that-man', 'fah', 'emotional-damage'], earB: ['oh-my-god', 'pay-that-man', 'fah', 'emotional-damage'], earGap: 700,
  r2N: [2, 3, 4, 5, 6, 8, 10, 15], r2Silent: 5, r2Music: 1500,
  r3Runs: 3, r3Rev: 2, r3Sounds: ['fah', 'emotional-damage', 'show-me-the-money'],
  r4Windows: 3, r4Burst: [[0, 'what'], [250, 'bruh'], [500, 'what'], [750, 'what-happened'], [1000, 'what'], [1250, 'very-nice']],
  r5Sounds: ['what', 'bruh', 'what-happened', 'very-nice', 'cool-story-bro', 'boomshakalaka'], r5Plays: 3, r5Gap: 500,
  r6Idle: 90000, r7Wait: 120000
};

/* ---------------- log + results ---------------- */
const T0 = performance.now(), now = () => Math.round(performance.now() - T0);
const wait = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const LOG = [];
function log(k, o){ const e = Object.assign({ t: now(), k }, o || {}); LOG.push(e); return e; }
const R = { v: PAGE_VERSION, page: 'soundtest', runId: Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7), fake: FAKE, quick: QUICK,
  flags: location.search, ua: navigator.userAgent, startedAt: new Date().toISOString(), cfg: CFG, answers: {}, sp: {}, rounds: {}, health: [], errors: [], log: LOG, done: false };
/* one key per run (written only after Start); finished / aborted runs wait on the OUTBOX until the Mac acknowledges */
const DATA = id => RES_KEY + ':' + id, OUTBOX = RES_KEY + '_outbox', SENTLIST = RES_KEY + '_sent';
const readJ = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } };
const outbox = () => readJ(OUTBOX, []);
function setOutbox(l){ try { localStorage.setItem(OUTBOX, JSON.stringify(l)); } catch (e) {} }
function addOutbox(id){ const l = outbox(); if (!l.includes(id)){ l.push(id); setOutbox(l); } }
let STARTED = false;
function save(){ if (!STARTED) return false; R.savedAt = new Date().toISOString();
  let ok = false;
  try { localStorage.setItem(DATA(R.runId), JSON.stringify(R)); ok = true; }
  catch (e) { try { const lite = Object.assign({}, R, { log: LOG.slice(-600), logTrimmed: LOG.length }); localStorage.setItem(DATA(R.runId), JSON.stringify(lite)); ok = true; } catch (x) { log('save-failed', { err: String(x) }); } }
  if (ok && (R.done || R.aborted) && !R.sentOk) addOutbox(R.runId);
  return ok; }

/* ---------------- screen helpers ---------------- */
const $ = id => document.getElementById(id);
function prog(t){ $('prog').textContent = t; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function show(html){ $('screen').innerHTML = html; window.scrollTo(0, 0); }
function listen(top, line, sub){ prog(top); show('<p class="listen">' + esc(line) + '</p>' + (sub ? '<p class="note" style="text-align:center">' + esc(sub) + '</p>' : '')); }
function screen(title, bodyHtml, buttons, opts){
  opts = opts || {};
  return new Promise(res => {
    prog(opts.top || '');
    show('<h1>' + esc(title) + '</h1>' + bodyHtml + '<div class="btns">' + buttons.map((b, i) =>
      '<button data-i="' + i + '" aria-label="' + esc(b.label) + '"' + (b.go ? ' class="go"' : '') + '>' + esc(b.label) + '</button>').join('') + '</div>');
    const at = now(); let done = false;
    const pick = (i, auto) => { if (done) return; done = true; const b = buttons[i]; log('answer', { title, v: b.v, auto: !!auto, ms: now() - at }); res(b.v); };
    $('screen').querySelectorAll('button').forEach(el => el.addEventListener('click', () => pick(+el.dataset.i, false)));
    if (AUTO && opts.auto !== undefined){ const i = buttons.findIndex(b => b.v === opts.auto); setTimeout(() => pick(i < 0 ? 0 : i, true), 500); }
  });
}
const countBtns = n => Array.from({ length: n + 1 }, (_, v) => ({ label: String(v), v }));

/* ---------------- taps, wake lock, visibility ---------------- */
let lastTapAt = null, tapCount = 0;
['pointerdown', 'touchend'].forEach(ev => window.addEventListener(ev, () => { lastTapAt = now(); tapCount++; onTap(); }, { passive: true, capture: true }));
let wakeLock = null;
async function askWakeLock(why){
  if (!('wakeLock' in navigator)){ R.wakeLock = R.wakeLock || 'not available in this browser'; log('wakelock', { why, granted: false, err: 'not available' }); return; }
  try { wakeLock = await navigator.wakeLock.request('screen'); R.wakeLock = 'granted'; log('wakelock', { why, granted: true });
    wakeLock.addEventListener('release', () => log('wakelock-released'));
  } catch (e) { R.wakeLock = R.wakeLock === 'granted' ? 'granted' : 'refused: ' + (e.name || e); log('wakelock', { why, granted: false, err: String(e) }); }
}
const visWaiters = [];
document.addEventListener('visibilitychange', () => { log('visibility', { hidden: document.hidden });
  if (!document.hidden && STARTED && wakeLock && wakeLock.released) askWakeLock('back visible');
  visWaiters.splice(0).forEach(f => f(document.hidden)); });
window.addEventListener('pagehide', () => { log('pagehide'); save(); musicBackOnLeave(); });

/* ---------------- audio session ('playback' all the time, except round 5 and the probes) ---------------- */
const AS = navigator.audioSession || null;
function sess(type, why){
  if (type === 'transient' || type === 'transient-solo') throw new Error('never set ' + type);   /* run 1: it killed every player */
  let err = null;
  try { if (AS) AS.type = type; } catch (e) { err = e.name || String(e); }
  const got = AS ? AS.type : 'n/a';
  log('sess', { want: type, got, why: why || '', err });
  return got;
}
if (AS){ try { AS.addEventListener('statechange', () => log('sess-state', { type: AS.type })); } catch (e) {} }
sess('ambient', 'page load');

/* ---------------- fake Spotify (only with ?fake=1) ---------------- */
let fakeIgorPlay = null;
if (FAKE){
  const login = Q.get('login') || 'valid';
  if (login === 'none') localStorage.removeItem(SP_AUTH_KEY);
  else localStorage.setItem(SP_AUTH_KEY, JSON.stringify({ access: 'fake-a-0', refresh: 'fake-r-0', exp: login === 'expired' ? Date.now() - 5000 : Date.now() + 3600e3 }));
  const real = window.fetch.bind(window), fk = { playing: true, pausedAt: 0, n: 0 };
  const die = (Q.get('spDie') || '').split(',').filter(Boolean).map(Number);              /* seconds of pause after which step 1 / 2 / 3 no longer work */
  const pausedFor = () => fk.playing ? 0 : (Date.now() - fk.pausedAt) / 1000;
  const works = step => !die.length || pausedFor() < die[Math.min(step, die.length - 1)];
  const asleep = () => die.length && !fk.playing && pausedFor() >= die[0];
  const dev = () => ({ id: 'fake-ipad', is_active: !asleep(), name: 'Fake iPad', type: 'Tablet', supports_volume: false, volume_percent: 80 });
  const J = (status, obj) => new Response(status === 204 ? null : JSON.stringify(obj || {}), { status, headers: { 'Content-Type': 'application/json' } });
  const NAD = () => J(404, { error: { status: 404, message: 'Player command failed: No active device found', reason: 'NO_ACTIVE_DEVICE' } });
  fakeIgorPlay = () => { fk.playing = true; log('fake', { igorPressedPlay: true }); };
  window.fetch = async (url, opt) => {
    const u = String(url); opt = opt || {};
    if (Q.get('hang') && u.includes('/sounds/' + Q.get('hang') + '.m4a')) return new Promise(() => {});
    if (!/^https:\/\/(api|accounts)\.spotify\.com\//.test(u)) return real(url, opt);
    await wait(rnd(150, 600));
    if (/accounts\.spotify\.com\/api\/token/.test(u)){
      if (Q.get('fail400') === '1') return J(400, { error: 'invalid_grant' });
      fk.n++; return J(200, { access_token: 'fake-a-' + fk.n, token_type: 'Bearer', expires_in: 3600, refresh_token: 'fake-r-rotated-' + fk.n });
    }
    const auth = (opt.headers && opt.headers.Authorization) || '';
    if (!/^Bearer fake-a-/.test(auth)) return J(401, { error: { status: 401, message: 'fake bad token' } });
    const p = u.replace('https://api.spotify.com/v1', ''), m = (opt.method || 'GET').toUpperCase();
    if (m === 'GET' && p.startsWith('/me/player/devices')) return J(200, { devices: [dev()] });
    if (m === 'GET' && p.startsWith('/me/player')) return asleep() ? J(204) : J(200, { is_playing: fk.playing, device: dev(), progress_ms: 1000, item: { id: 'x', name: 'Fake song', duration_ms: 200000 } });
    if (m === 'PUT' && p.startsWith('/me/player/pause')){ if (!fk.playing) return J(403, { error: { status: 403, message: 'Restriction violated', reason: 'UNKNOWN' } }); fk.playing = false; fk.pausedAt = Date.now(); return J(204); }
    if (m === 'PUT' && p.startsWith('/me/player/play')){ const step = p.includes('device_id=') ? 1 : 0; if (fk.playing) return J(204); if (!works(step)) return NAD(); fk.playing = true; return J(204); }
    if (m === 'PUT' && p === '/me/player'){ if (fk.playing) return J(204); if (!works(2)) return NAD(); fk.playing = true; return J(204); }
    if (m === 'PUT' && p.startsWith('/me/player/volume')) return J(403, { error: { status: 403, reason: 'VOLUME_CONTROL_DISALLOW' } });
    return J(404, { error: { status: 404, message: 'fake: no such path' } });
  };
  log('fake', { login, spDie: die, kill: Q.get('kill'), hang: Q.get('hang') });
}

/* ---------------- Spotify (the clock's login, the clock's token rules; an error never clears the login) ---------------- */
const sp = {
  device: null, refreshes: [], pausedByUs: false, dead: false,
  read(){ try { return JSON.parse(localStorage.getItem(SP_AUTH_KEY) || 'null'); } catch (e) { return null; } },
  connected(){ const a = this.read(); return !!(a && a.refresh); },
  async refresh(force){
    const cur = this.read(); if (!cur || !cur.refresh) return false;
    if (!force && Date.now() <= cur.exp) return true;
    if (this.dead) return false;
    const rec = { at: now(), force: !!force, status: null }; this.refreshes.push(rec);
    let res;
    try { res = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: cur.refresh, client_id: SPOTIFY_CLIENT_ID }) }); }
    catch (e) { rec.status = 0; rec.err = String(e); log('sp-refresh', rec); return false; }
    rec.status = res.status;
    if (!res.ok){ if (res.status === 400) this.dead = true; log('sp-refresh', rec); return false; }
    let j; try { j = await res.json(); } catch (e) { rec.err = 'bad json'; log('sp-refresh', rec); return false; }
    if (!j.access_token){ rec.err = 'no access_token'; log('sp-refresh', rec); return false; }
    const next = { access: j.access_token, refresh: j.refresh_token || cur.refresh, exp: Date.now() + (j.expires_in || 3600) * 1000 - 60000 };   /* = the clock's this.auth */
    try { localStorage.setItem(SP_AUTH_KEY, JSON.stringify(next)); rec.saved = true; } catch (e) { rec.saved = false; rec.err = String(e); }
    const back = this.read();
    rec.newRefresh = !!j.refresh_token && j.refresh_token !== cur.refresh;
    rec.format = back ? Object.keys(back).join(',') + ' / ' + [typeof back.access, typeof back.refresh, typeof back.exp].join(',') : 'missing';
    log('sp-refresh', rec); return true;
  },
  async token(){ let a = this.read(); if (!a || !a.refresh) return null;
    if (Date.now() > a.exp){ if (!(await this.refresh(false))) return null; a = this.read(); } return a && a.access; },
  async api(method, path, retry = true, tag, body){
    const t = await this.token();
    if (!t){ const e = log('sp', { method, path, status: 0, why: 'no token', sent: now(), back: now(), tag }); return { status: 0, sent: e.sent, back: e.back }; }
    const s2 = now(); let res;
    const headers = { Authorization: 'Bearer ' + t }; if (body) headers['Content-Type'] = 'application/json';
    try { res = await fetch('https://api.spotify.com/v1' + path, { method, headers, body: body ? JSON.stringify(body) : undefined }); }
    catch (e) { const r = log('sp', { method, path, status: 0, err: String(e), sent: s2, back: now(), tag }); return { status: 0, sent: s2, back: r.back }; }
    if (res.status === 401 && retry){ log('sp', { method, path, status: 401, sent: s2, back: now(), tag }); if (await this.refresh(true)) return this.api(method, path, false, tag, body); return { status: 401, sent: s2, back: now() }; }
    let data = null; if (res.status === 200 || res.status >= 400){ try { data = await res.json(); } catch (e) {} }
    const back = now(), e = (data && data.error) || {};
    if (method === 'PUT' && res.status >= 200 && res.status < 300){ if (path.startsWith('/me/player/pause')) this.pausedByUs = true; else if (path.startsWith('/me/player/play') || path === '/me/player') this.pausedByUs = false; }
    log('sp', { method, path, status: res.status, ms: back - s2, sent: s2, back, tag, reason: res.status >= 400 ? (e.reason || '') : undefined });
    return { status: res.status, data, sent: s2, back };
  },
  async state(tag){
    const r = await this.api('GET', '/me/player?additional_types=track,episode', true, tag);
    const d = r.status === 200 && r.data && r.data.device;
    if (d) this.device = { id: d.id, type: d.type, name: d.name, supports_volume: d.supports_volume, volume_percent: d.volume_percent, is_active: d.is_active };
    return { status: r.status, playing: r.status === 200 && !!(r.data && r.data.is_playing), ms: r.back - r.sent };
  },
  async activeListed(tag){
    const r = await this.api('GET', '/me/player/devices', true, tag);
    if (r.status !== 200 || !r.data) return { status: r.status, listed: null, active: null };
    const id = START_DEVICE && START_DEVICE.id, d = (r.data.devices || []).find(x => x.id === id);
    return { status: r.status, listed: !!d, active: d ? !!d.is_active : false, n: (r.data.devices || []).length };
  }
};
let SPON = false, MUSIC_AT_START = false, START_DEVICE = null;
/* bring the music back: 1 plain play, 2 play with device_id, 3 transfer playback to the device with play:true.
   Each step: the reply, then a state read. Returns which step worked (or null). */
async function restartMusic(tag){
  const out = { steps: [], worked: null };
  if (!SPON) return out;
  const id = (START_DEVICE && START_DEVICE.id) || (sp.device && sp.device.id);
  const tries = [['plain', () => sp.api('PUT', '/me/player/play', true, tag + ':plain'), 1000],
    ['device_id', () => id ? sp.api('PUT', '/me/player/play?device_id=' + encodeURIComponent(id), true, tag + ':device_id') : Promise.resolve({ status: -1, sent: now(), back: now() }), 1000],
    ['transfer', () => id ? sp.api('PUT', '/me/player', true, tag + ':transfer', { device_ids: [id], play: true }) : Promise.resolve({ status: -1, sent: now(), back: now() }), 1500]];
  for (const [how, send, settle] of tries){
    const r = await send(); await wait(settle); const s = await sp.state(tag + ':after-' + how);
    out.steps.push({ how, status: r.status, ms: r.back - r.sent, stateStatus: s.status, playing: s.playing });
    if (s.playing){ out.worked = how; break; }
  }
  log('restart', { tag, worked: out.worked, steps: out.steps.map(x => x.how + ':' + x.status + '/' + (x.playing ? 'playing' : 'not')) });
  return out;
}
/* "The music stopped" screen: Igor presses play in Spotify; afterwards the screen that was up comes back */
async function musicStoppedScreen(tag){
  const prevTop = $('prog').textContent, prevHtml = $('screen').innerHTML, hadButtons = !!$('screen').querySelector('button');
  await screen('The music stopped', '<p class="big">The page could not start the music again.</p><p class="big">Open the Spotify app, press play, then come back to this page and tap Continue.</p>', [{ label: 'Continue', v: 'c', go: true }]);
  if (fakeIgorPlay) fakeIgorPlay();
  prog(prevTop); if (hadButtons) show('<p class="listen">One moment…</p>'); else show(prevHtml);
  const s = await sp.state(tag + ':after-igor'); log('music', { tag, playing: s.playing, how: 'Igor pressed play' });
  return s.playing;
}
/* make sure the music plays before a round that needs it */
async function musicOn(tag){
  if (!SPON) return { skipped: true };
  const s = await sp.state(tag + ':check'); if (s.playing) return { playing: true, how: 'was playing' };
  const r = await restartMusic(tag); if (r.worked) return { playing: true, how: r.worked };
  return { playing: await musicStoppedScreen(tag), how: 'Igor' };
}
/* a pause window, the design under test: pause, 'playback', the sounds, music back (with the 3-step restart, then Igor) */
async function pauseWindow(tag, fn, noIgor){
  const w = { tag };
  if (SPON){ const r = await sp.api('PUT', '/me/player/pause', true, tag + ':pause'); w.pause = { status: r.status, ms: r.back - r.sent }; }
  const t0 = now(); sess('playback', tag);
  try { await fn(w); }
  finally {
    w.pausedMs = now() - t0;
    if (SPON){ w.restart = await restartMusic(tag); if (!w.restart.worked && !noIgor) w.igor = await musicStoppedScreen(tag); }
  }
  return w;
}
async function restoreMusic(why){ if (!SPON || !MUSIC_AT_START) return null; try { return await musicOn('restore:' + why); } catch (e) { log('restore-fail', { why, err: String(e) }); return null; } }
function musicBackOnLeave(){
  if (!STARTED || !SPON || !MUSIC_AT_START || R.musicRestoredAtEnd) return;
  const a = sp.read(); if (!a || !a.access) return;
  try { fetch('https://api.spotify.com/v1/me/player/play', { method: 'PUT', keepalive: true, headers: { Authorization: 'Bearer ' + a.access } }); log('leave-play-sent'); save(); } catch (e) {} }

/* ---------------- media elements: one tracker for every play ---------------- */
let JID = 0; const ACTIVE = new Set(), ALL_EL = [];
function wire(a, label){
  a._label = label;
  a.addEventListener('play', () => { const j = a._job; if (j && !j.closed) j.sawPlay = true; });
  a.addEventListener('playing', () => { const j = a._job; if (!j || j.closed || a.muted) return; if (j.playingAt == null){ j.playingAt = now(); j.ct0 = +a.currentTime.toFixed(3); j.durAt = isFinite(a.duration) ? +a.duration.toFixed(3) : null; } });
  a.addEventListener('pause', () => { const j = a._job; if (j && !j.closed && j.sawPlay) closeJob(j, a.ended ? 'ended' : 'pause'); });

/* ---------------- send to the Mac (PeerJS), only after the rounds ---------------- */
function loadScript(src){ return new Promise((ok, bad) => { if (window.Peer) return ok(); const s = document.createElement('script'); s.src = src; s.async = true; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
let sending = false, lastSay = '';
const say = (t, c) => { lastSay = t; if ($('sendState')){ $('sendState').textContent = t; $('sendState').className = 'big ' + (c || ''); } };
async function sendAll(){
  if (sending) return false;
  const ids = outbox(); if (!ids.length) return true;
  let all = true, n = 0;
  for (const id of ids){
    const obj = readJ(DATA(id), null);
    if (!obj){ setOutbox(outbox().filter(x => x !== id)); log('outbox-missing', { id }); continue; }
    n++; say(ids.length > 1 ? 'Sending result ' + n + ' of ' + ids.length + ' to the Mac…' : 'Sending results to the Mac…');
    const ok = await sendOne(obj);
    if (!ok){ all = false; continue; }
    obj.sentOk = new Date().toISOString();
    try { localStorage.setItem(DATA(id), JSON.stringify(obj)); } catch (e) {}
    if (id === R.runId) R.sentOk = obj.sentOk;
    setOutbox(outbox().filter(x => x !== id));
    const sent = readJ(SENTLIST, []).filter(x => x !== id); sent.push(id);
    while (sent.length > 3){ const old = sent.shift(); try { localStorage.removeItem(DATA(old)); } catch (e) {} }
    try { localStorage.setItem(SENTLIST, JSON.stringify(sent)); } catch (e) {}
  }
  const left = outbox().length;
  say(left ? 'Not sent yet (' + left + ' waiting). Trying again by itself every 15 seconds.' : 'Results sent to the Mac ✓', left ? 'warn' : 'ok');
  return all && !left;
}
async function sendOne(obj){
  if (sending || !obj) return false; sending = true;
  const runId = obj.runId, body = JSON.stringify(obj), SZ = 12000, n = Math.ceil(body.length / SZ);
  let peer = null;
  const ok = await new Promise(async res => {
    const to = setTimeout(() => res(false), 30000);
    try { await loadScript(PEERJS_SRC); } catch (e) { clearTimeout(to); res(false); return; }
    try { peer = new Peer({ debug: 0 }); } catch (e) { clearTimeout(to); res(false); return; }
    peer.on('error', e => { log('peer-error', { type: e && e.type }); clearTimeout(to); res(false); });
    peer.on('open', () => {
      const c = peer.connect(LISTENER_ID, { reliable: true, serialization: 'json' });
      c.on('data', m => { if (m && m.t === 'ack' && m.runId === runId){ clearTimeout(to); res(true); } });
      c.on('error', () => { clearTimeout(to); res(false); });
      c.on('open', async () => {
        c.send({ t: 'begin', runId, n, size: body.length });
        for (let i = 0; i < n; i++){ c.send({ t: 'chunk', runId, i, s: body.slice(i * SZ, (i + 1) * SZ) });
          for (let w = 0; w < 200 && c.dataChannel && c.dataChannel.bufferedAmount > 64000; w++) await wait(20); }
        c.send({ t: 'end', runId, n });
      });
    });
  });
  try { peer && peer.destroy(); } catch (e) {}
  sending = false; log('send', { runId, ok });
  return ok;
}
async function sendLoop(stopFn){ for (let i = 0; i < 200; i++){ if (stopFn && stopFn()) return; if (await sendAll()) return; await wait(15000); } }

  const btns = [{ label: 'Next', v: 'next', go: true }]; if (pending) btns.push({ label: 'Send results again', v: 'resend' });
  while ((await screen('Sound test 2', intro, btns)) === 'resend'){ await sendAll(); }
  await screen('Close the poker clock', '<p class="big">If the poker clock page is open in another Safari tab, close that tab now.</p>', [{ label: 'Next', v: 'next', go: true }]);
  await screen('Start the music', '<p class="big">Play music in the Spotify app on this iPad, then come back to this page.</p>', [{ label: 'Next', v: 'next', go: true }]);
  /* the Start tap: players made and unlocked, the AudioContext made, the wake lock asked for — all inside this tap */
  const startTap = () => { if (started) return; started = true; STARTED = true; makePools(); try { ctx = makeCtx('start tap'); decodeAll(); } catch (e) { log('ctx-fail', { err: String(e) }); } askWakeLock('start tap'); };
  const st = screen('Set the volume', '<p class="big">Turn the iPad volume up to a normal level, then tap Start.</p>', [{ label: 'Start', v: 'start', go: true }]);
  $('screen').querySelector('button').addEventListener('click', startTap, { capture: true });
  await st; startTap();
  const t0 = now();
  log('start', { cfg: CFG, session: AS ? AS.type : 'n/a' });
  SPON = sp.connected(); R.sp.login = SPON; R.sp.key = FAKE ? 'fake key' : 'clock key';
  if (SPON){ R.sp.atStart = await sp.state('start');
    if (R.sp.atStart.status === 0){ await wait(1200); R.sp.atStart = await sp.state('start-retry'); }
    if (R.sp.atStart.status === 0 || R.sp.atStart.status === 401){ SPON = false; R.sp.loginBroken = 'saved login did not give a token (status ' + R.sp.atStart.status + '); left as it is'; log('login-broken', { status: R.sp.atStart.status }); }
    else { MUSIC_AT_START = !!R.sp.atStart.playing; START_DEVICE = sp.device; R.sp.device = sp.device;
      const v = sp.device && sp.device.volume_percent != null ? await sp.api('PUT', '/me/player/volume?volume_percent=' + sp.device.volume_percent, true, 'volume-check') : null;
      R.sp.volume = v ? { status: v.status, reason: v.data && v.data.error ? v.data.error.reason || '' : '' } : null; } }
  save();
  R.answers.silentNow = await screen('Is Silent Mode on now?', '<p class="big">Silent Mode is the bell in Control Centre (swipe down from the top-right corner). Please do not change it.</p>',
    [{ label: 'On', v: 'on' }, { label: 'Off', v: 'off' }, { label: 'Don’t know', v: 'don’t know' }], { top: 'Part 1 of 3: one question', auto: 'on' });
  save();
  try { await Promise.race([decodeP, wait(9000)]); } catch (e) {}
  await round('R1', P.ear, runR1);
  await screen('Now the page tests by itself', '<p class="big">Put the iPad down and do not touch it for about 4 minutes.</p><p class="big">Near the end it asks you to open the Spotify app for a moment.</p><p>Sounds will play and the music will stop and start. That is expected.</p>',
    [{ label: 'Start', v: 'go', go: true }], { top: P.auto });
  askWakeLock('auto part');
  show('<p class="listen">Testing… please do not touch the iPad</p>');
  await round('R5', P.auto + ' · check 1 of 6', runR5);            /* harmless first: 'ambient', no music change */
  await round('R4', P.auto + ' · check 2 of 6', runR4);            /* short pause windows */
  await round('R3', P.auto + ' · check 3 of 6', runR3);            /* the music coming back mid-sound */
  await round('R6', P.auto + ' · check 4 of 6', runR6);            /* the 90 s without a touch is normally over by now */
  await round('R2', P.auto + ' · check 5 of 6', runR2);            /* long pauses: the most disruptive */
  await round('R7', P.auto + ' · check 6 of 6', runR7);
  R.runS = Math.round((now() - t0) / 1000);
  await finish();
}
async function finish(){
  try { sess('playback', 'end'); } catch (e) {}
  if (SPON && MUSIC_AT_START){ R.sp.atEnd = await restoreMusic('end'); }
  else R.sp.atEnd = SPON ? await sp.state('end') : { skipped: true };
  R.musicRestoredAtEnd = !!(R.sp.atEnd && R.sp.atEnd.playing);
  R.sp.refreshes = sp.refreshes;
  if (!R.aborted) R.done = true; R.endedAt = new Date().toISOString(); log('DONE');
  R.summary = summarise(R); save();
  prog('');
  show('<h1>' + (R.aborted ? 'The test stopped early' : 'Finished. Thank you!') + '</h1><p id="sendState" class="big"></p>' +
    plainSummary().map(l => '<p class="big">' + esc(l) + '</p>').join('') +
    '<div class="btns"><button id="resend" aria-label="Send results again">Send results again</button></div><h2 style="margin-top:40px">Details</h2>' + tablesHtml(R.summary));
  $('resend').addEventListener('click', () => sendAll());
  await sendLoop();
}
main().catch(async e => {
  log('fatal', { err: String(e), stack: e && e.stack }); R.aborted = true; R.errors.push({ round: 'run', err: String(e) });
  if (STARTED){ try { await finish(); return; } catch (x) { log('fatal2', { err: String(x) }); } }
  save(); show('<h1>Something went wrong</h1><p class="big">Please reload the page. Nothing is lost.</p>');
});
</script>
